[workspace]
resolver = "2"
members = [
    "oxeye-backend",
    "oxeye-db",
]

[profile.release]
lto = true

[workspace.dependencies]
# Web framework
axum = "0.8.8"
axum-macros = "0.5.0"
axum-extra = { version = "0.12.3", features = ["typed-header"] }
headers = "0.4.1"
tokio = { version = "1.48.0", features = ["full"] }
tower = "0.5.2"
tower_governor = { version = "0.8.0", features = ["axum"] }
tower-http = { version = "0.7.1", features = ["cors", "trace", "limit", "timeout", "set-header"] }

# Database
tokio-rusqlite = { version = "0.7", features = ["bundled"]}
oxeye-db = { path = "oxeye-db" }

# Serialization
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"

# Error handling
anyhow = "1.0.100"
thiserror = "2.0.17"

# Logging
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }

# Discord
# Pinned to serenity `next` until a crates.io release updates tokio-tungstenite
# (rustls 0.22 -> rustls-webpki 0.102.x, GHSA-82j2-j2ch-gfr8).
# https://github.com/serenity-rs/serenity/issues/3622
poise = { git = "https://github.com/serenity-rs/poise.git", branch = "serenity-next" }


# special data structures
scc = "3.4.8"
arrayvec = "0.7.6"

# Image processing (for skin rendering)
image = { version = "0.25", default-features = false, features = ["png"] }
imageproc = "0.25"
ab_glyph = "0.2"

# Encoding
base64 = "0.22"
